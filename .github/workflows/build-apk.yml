name: iStream Android APK Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Release iStream APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Signed Release APK with Gradle
        run: gradle assembleRelease -x test

      - name: Prepare APK Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/iStream-v1.0.2.apk
          ls -lh dist/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iStream-v1.0.2-apk
          path: dist/iStream-v1.0.2.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "iStream Android App v1.0.2"
          body: |
            ### iStream Official Android App (Release v1.0.2)
            
            **Universal Android Compatibility & Package Parsing Fix:**
            - **Universal MinSDK 21**: Supports Android 5.0 through Android 15.
            - **Signed Release APK**: Signed with both v1 and v2 APK signature schemes.
            - **Zero Package Parsing Errors**: Fully resolves "problem parsing the package".
            - **Direct Stream Endpoint**: Instant connection to public streaming cluster.
            
            #### Direct Download:
            Click **`iStream-v1.0.2.apk`** below to download and install.
          files: dist/iStream-v1.0.2.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
